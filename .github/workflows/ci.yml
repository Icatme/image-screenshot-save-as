name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test

      - name: Run real-Chrome extension smoke test
        run: npm run test:browser
        env:
          IMG_SAVE_AS_REQUIRE_BROWSER_SMOKE: "1"

      - name: Verify checked-in release artifacts
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Rebuild release artifacts deterministically
        shell: pwsh
        run: ./scripts/package-release.ps1

      - name: Confirm release artifacts are current
        shell: pwsh
        run: git diff --exit-code -- dist
